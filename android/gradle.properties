# --- BidDrive backend URL --------------------------------------------------------------
# The deployed Render API is preconfigured in app/build.gradle.kts for debug and release builds.
# To override it, set biddrive.apiBaseUrl in local.properties or pass:
#   ./gradlew assembleRelease -PbiddriveApiBaseUrl=https://biddrive-api.onrender.com/api/
# URL must end with /api/. Release builds require https.
# biddriveApiBaseUrl=https://biddrive-api.onrender.com/api/
